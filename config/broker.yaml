broker:
  id: 1                        # unique broker ID in the cluster
  host: "0.0.0.0"
  port: 9092

cluster:
  brokers:                     # known peers (for metadata sync)
    - id: 1
      host: "broker-1"
      port: 9092
    - id: 2
      host: "broker-2"
      port: 9092
    - id: 3
      host: "broker-3"
      port: 9092

storage:
  log_dir: "/var/kafka/logs"   # base directory for partition log segments
  segment_max_bytes: 1073741824      # 1 GB per segment file
  retention_ms: 604800000            # 7 days
  retention_bytes: 10737418240       # 10 GB total per partition

replication:
  default_replication_factor: 3
  min_insync_replicas: 2

topic_defaults:
  num_partitions: 4
  replication_factor: 3
